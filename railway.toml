# Railway configuration for the DesignLens web service.
# The worker service is a second Railway service using the same repo
# with startCommand = "npm run worker"  (see DEPLOY.md for full setup).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
