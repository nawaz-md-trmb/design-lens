# Railway — DesignLens production deploy
# Docs: https://docs.railway.com/guides/github-repo

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# After first deploy, add a volume in the Railway dashboard:
#   Mount path: /app/public
#   (persists reports and ci-runs across restarts)
