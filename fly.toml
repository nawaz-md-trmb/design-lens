# Fly.io deploy (Docker + Playwright). Requires ~2GB RAM — not on Fly free 256MB tier.
# See SHARE.md for free Cloudflare Tunnel sharing from your machine.

app = 'design-lens'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOSTNAME = '0.0.0.0'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '10s'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 2

[mounts]
  source = 'report_data'
  destination = '/app/public/reports'
