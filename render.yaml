# Render Blueprint — single Docker web service (no Vercel required).
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.

services:
  - type: web
    name: designlens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: DESIGNLENS_API_KEY
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: ADO_ORG
        sync: false
      - key: ADO_PROJECT
        sync: false
      - key: ADO_PAT
        sync: false
    disk:
      name: designlens-public
      mountPath: /app/public
      sizeGB: 5
